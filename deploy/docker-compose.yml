# ═══════════════════════════════════════════════════════════════════════════
# T-61: Nexo en un VPS — Traefik (HTTPS automático con Let's Encrypt) + la app.
# Guía completa: docs/19-vps.md.
#
# T-74: el servidor NO construye la imagen. La construye GitHub Actions al
# publicar una release (.github/workflows/deploy.yml), la manda al VPS y
# levanta esta composición en /opt/nexo con la versión en NEXO_VERSION. Con
# 1 GB de RAM, compilar Next en el servidor no entra; recibirla hecha sí.
#
# La base de datos, el login y los archivos siguen en Supabase: el VPS solo
# corre la app (así los backups y el mantenimiento de la base no son nuestros).
# ═══════════════════════════════════════════════════════════════════════════

services:
  traefik:
    # T-75: v3.1 no funciona con Docker 29: Docker 29 dejó de aceptar
    # clientes que piden una versión vieja de su API, y Traefik antes de
    # v3.6.1 no podía leer los contenedores. Sin rutas no pide el
    # certificado y sirve uno provisorio (ERR_CERT_AUTHORITY_INVALID en el
    # navegador). La etiqueta v3.6 sigue los parches de la 3.6.
    image: traefik:v3.6
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      # Todo lo que entra por http se redirige a https.
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --certificatesresolvers.le.acme.httpchallenge=true
      - --certificatesresolvers.le.acme.httpchallenge.entrypoint=web
      - --certificatesresolvers.le.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - letsencrypt:/letsencrypt

  app:
    # La etiqueta de la release (v1.0.0, v1.1.0…). La escribe el despliegue en
    # .env.production, así un reinicio o un `up` a mano levanta la misma
    # versión que se desplegó, no otra.
    image: nexo-app:${NEXO_VERSION:?falta NEXO_VERSION en .env.production}
    restart: unless-stopped
    env_file: .env.production
    # Margen para que termine de procesar los webhooks en curso al reiniciar.
    stop_grace_period: 30s
    # T-65: `docker compose ps` muestra si la app está sana (base incluida).
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    labels:
      - traefik.enable=true
      - traefik.http.routers.nexo.rule=Host(`${DOMINIO}`)
      - traefik.http.routers.nexo.entrypoints=websecure
      - traefik.http.routers.nexo.tls.certresolver=le
      - traefik.http.services.nexo.loadbalancer.server.port=3000

volumes:
  letsencrypt:
