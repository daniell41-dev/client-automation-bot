name: CI

on:
  pull_request:
  push:
    branches: [develop, main]

# Si llegan pushes seguidos al mismo PR/rama, cancela la corrida vieja: no tiene
# sentido esperar un CI que ya quedó obsoleto.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest

    # Postgres de servicio para supabase/tests/rls.test.ts y cascade.test.ts
    # (T-03/T-08): ambos corren las migraciones REALES de supabase/migrations/
    # y se saltan solos (`describe.skipIf`) si no hay TEST_DATABASE_URL — acá
    # sí la hay, así que quedan cubiertos por el mismo `pnpm test` de siempre.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres

    steps:
      - uses: actions/checkout@v4

      # pnpm antes que setup-node: el caché "pnpm" de actions/setup-node
      # necesita el binario ya instalado para resolver la ruta del store.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm exec tsc --noEmit

      - run: pnpm test

      - run: pnpm build
